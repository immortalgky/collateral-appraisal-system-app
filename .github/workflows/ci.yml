name: React CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  react-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Test
        run: pnpm test

      # Never once succeeded: the action stopped taking organization/projectKey as inputs and
      # wants -Dsonar.* args or a sonar-project.properties, and the key here is the API
      # project's, not this repo's. It only surfaced now because Test used to fail first and
      # skip it. Non-blocking like Lint until the project and key are settled, so a failure
      # here stops reaching Build.
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          organization: immortalgky
          projectKey: immortalgky_collateral-appraisal-system-api
          projectName: collateral-appraisal-system-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Build
        run: pnpm run build