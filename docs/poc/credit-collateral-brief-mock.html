<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0B0F14;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:is(button,a,[tabindex]):focus-visible{outline:2px solid #2DD4BF;outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ══ gallery chrome ══════════════════════════════════════════════════════ */
.bar{position:sticky;top:0;z-index:100;background:#0B0F14;border-bottom:1px solid #1B222C;
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:#8C97A5}
.bar .in{max-width:1400px;margin:0 auto;padding:10px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.bar .lbl{font-size:10px;font-weight:700;letter-spacing:.16em;color:#5A6572;text-transform:uppercase}
.bar .grp{display:flex;gap:4px;flex-wrap:wrap}
.bar .grp button{border:1px solid #232C38;background:transparent;color:#8C97A5;border-radius:6px;
  padding:6px 13px;font-size:12px;font-weight:500;transition:.14s}
.bar .grp button:hover{color:#DCE3EA;border-color:#33404F}
.bar .grp button.on{background:#0EA394;border-color:#0EA394;color:#04211E;font-weight:600}
.bar .sp{flex:1}
.bar .cases button.on{background:#F2C14E;border-color:#F2C14E;color:#3A2A05}
.desc{max-width:1400px;margin:0 auto;padding:0 22px 12px;font-size:12px;color:#6D7885;
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif}
.desc b{color:#B9C4CF;font-weight:600}

/* ══ stage ═══════════════════════════════════════════════════════════════ */
.stage{padding:0}

/* ─────────────────────────────────────────────────────────────────────────
   Every direction renders the SAME markup. Only the CSS below differs, so a
   direction can be judged on its own terms instead of on what it contains.
   ───────────────────────────────────────────────────────────────────────── */
.doc{min-height:100vh}
.page{margin:0 auto}
.sec{position:relative}
.tags,.vsub,.rail,.assets,.docs{list-style:none;margin:0;padding:0}
.hidden{display:none!important}

/* ══════════════ A · CONSOLE — dense, dark, data-first ═══════════════════ */

[data-dir="a"] .mono,[data-dir="a"] .vnum,[data-dir="a"] .amt,[data-dir="a"] .vsub .v,
[data-dir="a"] .mlab .v,[data-dir="a"] .total b{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
[data-dir="a"] .hero{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;

  border:1px solid #232D39;color:#8494A2;padding:3px 9px;border-radius:3px}

[data-dir="a"] .rail{display:flex;padding-top:26px}
[data-dir="a"] .stn{flex:1;position:relative;text-align:center;min-width:0;padding:0 3px}

[data-dir="a"] .stn .dt{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#57646F;margin-top:3px}

      f('เบอร์ติดต่อ',esc(c.tel))+f('ประเภทหลักประกัน',esc(c.ptype))+f('วัตถุประสงค์',esc(c.purpose))+
      f('วงเงินที่ขอ',n(c.requested))+f('ราคาประเมินราชการ',o?n(c.gov):'รอผล')+
      f('ผู้ยื่นคำขอ',esc(c.officer)+' · '+esc(c.branch))+
      '</div></section>';

    var fine='<footer class="fine"><ol>'+
      '<li>ตัวเลขในหน้านี้ใช้ประกอบการพิจารณาสินเชื่อเท่านั้น ไม่ใช่การรับรองราคาซื้อขายในตลาด</li>'+
      '<li>ราคาบังคับขายคำนวณตามเกณฑ์ที่ธนาคารกำหนด และเป็นฐานของเพดานวงเงินหลักประกัน</li>'+
      '<li>หากต้องการทบทวนราคา ให้ยื่นคำขอประเมินใหม่ผ่านระบบ</li></ol>'+
      '<div class="sig">ออกโดยระบบประเมินราคาหลักประกัน<br>'+esc(c.brief)+' · 09/09/2026 09:41</div></footer>';

    return hero+rail+money+docs+info+fine;
  }


  function render(){
    var c=CASES[S.i];
    document.getElementById('doc').setAttribute('data-dir',S.dir);
    document.getElementById('page').innerHTML=view(c);

    var d=DIRS.filter(function(x){return x.k===S.dir;})[0];
    document.getElementById('desc').innerHTML=d.d;
    Array.prototype.forEach.call(document.querySelectorAll('#dirs button'),function(b){
      b.classList.toggle('on',b.getAttribute('data-k')===S.dir);});
    Array.prototype.forEach.call(document.querySelectorAll('#cases button'),function(b,i){
      b.classList.toggle('on',i===S.i);});
  }
  document.getElementById('dirs').innerHTML=DIRS.map(function(d){
    return '<button data-k="'+d.k+'">'+esc(d.n)+'</button>';}).join('');
  document.getElementById('cases').innerHTML=CASES.map(function(c,i){
    return '<button data-i="'+i+'">'+esc(c.tab)+'</button>';}).join('');
  document.getElementById('dirs').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return; S.dir=b.getAttribute('data-k'); render();
    window.scrollTo({top:0,behavior:'instant'});});
  document.getElementById('cases').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return; S.i=+b.getAttribute('data-i'); render();});
  render();
})();
</script>
