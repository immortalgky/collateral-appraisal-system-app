<meta charset="utf-8" />
<title>Reappraisal Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* POC ONLY — standalone mock with sample data. No app code is touched.
     Layout: the app's own shell (SectionHeader row, one white table card), denser columns,
     due-date first; detail = due strip, grouped facts, group table with an action bar.
     Single light theme on purpose: the app has no dark mode. */
  :root {
    --bg: #f3f6f6;
    --surface: #ffffff;
    --ink: #1f2937;
    --ink-2: #6b7280;
    --ink-3: #9ca3af;
    --line: #e5e7eb;
    --line-soft: #f1f3f3;
    --head: #f9fafb;
    --primary: #0d9488;
    --primary-700: #0f766e;
    --primary-50: #f0fdfa;
    --primary-100: #ccfbf1;
    --crit: #b91c1c;   --crit-bg: #fef2f2;  --crit-line: #fecaca;
    --warn: #b45309;   --warn-bg: #fffbeb;  --warn-line: #fde68a;
    --note: #0369a1;   --note-bg: #f0f9ff;  --note-line: #bae6fd;
    --legacy: #6d28d9; --legacy-bg: #f5f3ff; --legacy-line: #ddd6fe;
    --mock: #334155;   --mock-bg: #e2e8f0;
    --be: #9a3412;     --be-bg: #ffedd5;
    --font: 'Roboto', 'Sarabun', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 12px; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* ── Mock chrome (not part of the design) ── */
  .mockbar { background: var(--mock-bg); color: var(--mock); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; border-bottom: 1px solid #cbd5e1; }
  .mockbar b { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .mockbar .grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .mockbar .grp span { font-size: 11px; color: #64748b; margin-right: 2px; }
  .mockbar button { border: 1px solid #cbd5e1; background: #fff; border-radius: 999px; padding: 4px 11px; font-size: 11.5px; cursor: pointer; }
  .mockbar button[aria-pressed='true'] { background: var(--mock); color: #fff; border-color: var(--mock); }
  .shell { padding: 16px; max-width: 1440px; margin: 0 auto; display: grid; gap: 14px; }

  /* ── Change notes (not part of the design) ── */
  .notes { background: #fff; border: 1px dashed #94a3b8; border-radius: 8px; padding: 12px 14px; }
  .notes h4 { margin: 0 0 6px; font-size: 12px; color: var(--mock); }
  .notes ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; line-height: 1.55; color: #334155; }
  .be { display: inline-block; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: var(--be-bg); color: var(--be); margin-left: 4px; vertical-align: 1px; }
  .q { display: inline-block; font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: var(--note-bg); color: var(--note); margin-left: 4px; vertical-align: 1px; }

  /* ── Page header (= SectionHeader + right-side controls) ── */
  .phead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; }
  .phead h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .phead p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
  .ctrls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); background: var(--head); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .seg button[aria-pressed='true'] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
  .seg .cnt { font-size: 10.5px; color: var(--ink-3); }
  .seg button[aria-pressed='true'] .cnt { color: var(--primary-700); }
  .search { position: relative; }
  .search input { width: 260px; max-width: 70vw; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px 7px 28px; font: inherit; font-size: 12px; }
  .search input:focus, .field input:focus, .field select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,.15); }
  .search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; color: var(--ink-3); }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--ink); white-space: nowrap; }
  .btn:hover { border-color: #d1d5db; background: #fafafa; }
  .btn:focus-visible, .seg button:focus-visible, .chip-btn:focus-visible, .ck:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-700); }
  .btn.primary[disabled] { background: #99d5cf; border-color: #99d5cf; cursor: not-allowed; }
  .btn.danger { background: #dc2626; border-color: #dc2626; color: #fff; }
  .btn.danger:hover { background: #b91c1c; }
  .gpin { width: 13px; height: 13px; flex-shrink: 0; }
  .btn .badge { background: var(--primary); color: #fff; border-radius: 999px; font-size: 10px; min-width: 16px; height: 16px; display: inline-grid; place-items: center; padding: 0 4px; }
  .btn.primary .badge { background: rgba(255,255,255,.25); }

  /* ── Quick filters ── */
  .quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
  .chip-btn b { font-weight: 600; color: var(--ink); }
  .chip-btn[aria-pressed='true'] { border-color: var(--primary); background: var(--primary-50); color: var(--primary-700); }
  .chip-btn[aria-pressed='true'] b { color: var(--primary-700); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* ── Table card ── */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 2px rgba(15,23,42,.04); min-width: 0; }
  .tscroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: var(--head); border-bottom: 1px solid var(--line); text-align: left; font-weight: 500; font-size: 11.5px; color: var(--ink-2); padding: 9px 12px; white-space: nowrap; position: sticky; top: 0; }
  thead th.sorted { background: var(--primary-50); }
  thead th .arr { color: var(--primary); }
  thead th .arr { font-size: 9px; margin-left: 3px; }
  tbody td { padding: 8px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: #f9fbfb; }
  tbody tr.busy td { background: #fcfcfb; }
  .two { display: grid; gap: 1px; min-width: 0; }
  .two .a { font-weight: 500; color: var(--ink); white-space: nowrap; }
  .book, .two .a.book { color: var(--primary); }
  .two .b { font-size: 11px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .book { display: inline-flex; gap: 6px; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
  .tag.legacy { color: var(--legacy); background: var(--legacy-bg); border-color: var(--legacy-line); }
  .tag.unknown { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-line); }
  .tag.main { color: var(--primary-700); background: var(--primary-50); border-color: var(--primary-100); }
  .tag.as400 { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
  .tag.cas { color: var(--note); background: var(--note-bg); border-color: var(--note-line); }
  .tag.unit { color: #0f766e; background: #f0fdfa; border-color: #99f6e4; }
  .b.miss { color: var(--warn); }
  .fill { display: grid; grid-template-columns: max-content minmax(0,1fr) max-content; gap: 6px 14px; margin: 0; }
  .fill dt { color: var(--ink-2); white-space: nowrap; }
  .fill dd { margin: 0; font-weight: 500; }
  .src { font-size: 10px; color: var(--ink-3); white-space: nowrap; text-align: right; }
  .manual { color: var(--warn); font-weight: 400; }
  .rt { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .rt.s3 { background: var(--crit-bg); color: var(--crit); }
  .rt.s2 { background: var(--warn-bg); color: var(--warn); }
  .rt.s1 { background: #f3f4f6; color: #4b5563; }
  .due { display: grid; gap: 1px; white-space: nowrap; }
  .due .when { font-weight: 500; }
  .due .left { font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }
  .u-crit { color: var(--crit); } .u-crit-bg { background: var(--crit); }
  .u-warn { color: var(--warn); } .u-warn-bg { background: #f59e0b; }
  .u-note { color: var(--note); } .u-note-bg { background: #38bdf8; }
  .u-ok { color: var(--ink-2); } .u-ok-bg { background: #cbd5e1; }
  .prog { display: grid; gap: 1px; }
  .prog .s { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
  .prog .l { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
  .prog a { color: var(--primary-700); text-decoration: none; }
  .prog a:hover { text-decoration: underline; }
  .muted { color: var(--ink-3); }
  .chev { color: #d1d5db; }
  tr.click:hover .chev { color: var(--primary); }
  .pager { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 11.5px; flex-wrap: wrap; gap: 8px; }

  /* ── Detail ── */
  .back { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; background: var(--surface); cursor: pointer; flex-shrink: 0; }
  .titlewrap { display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
  .titleline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .banner { border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid; }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); color: #78350f; }
  .banner.legacy { background: var(--legacy-bg); border-color: var(--legacy-line); color: #4c1d95; }
  .banner.skip { background: var(--crit-bg); border-color: var(--crit-line); color: #7f1d1d; }
  .banner .t { font-weight: 600; margin-bottom: 2px; }
  .banner .body { flex: 1; min-width: 0; line-height: 1.55; }

  .duestrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .stat { padding: 12px 16px; border-left: 1px solid var(--line-soft); }
  .stat:first-child { border-left: 0; }
  .stat .k { font-size: 11px; color: var(--ink-2); }
  .stat .v { font-size: 15px; font-weight: 600; margin-top: 3px; white-space: nowrap; }
  .stat .s { font-size: 11px; color: var(--ink-3); margin-top: 1px; }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
  .facts .card { padding: 12px 14px; }
  .facts h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
  .facts h3 small { font-weight: 400; color: var(--ink-3); font-size: 11px; }
  dl.kv { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; }
  dl.kv dt { color: var(--ink-2); white-space: nowrap; }
  dl.kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  dl.kv dd.long { font-weight: 400; line-height: 1.5; }

  .grouphead { padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .grouphead h3 { margin: 0; font-size: 12px; font-weight: 600; }
  .grouphead p { margin: 2px 0 0; font-size: 11px; color: var(--ink-2); }
  .ck { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid #cbd5e1; background: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ck[aria-checked='true'] { background: var(--primary); border-color: var(--primary); }
  .ck[aria-checked='true']::after { content: ''; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .ck[disabled] { opacity: .45; cursor: default; }
  tr.sel td { background: #f6fcfb; }
  tr.blocked td { color: var(--ink-3); }
  .rowact { border: 1px solid transparent; background: none; color: var(--ink-2); font-size: 11px; padding: 3px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .rowact:hover { border-color: var(--crit-line); color: var(--crit); background: var(--crit-bg); }
  .actionbar { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); background: #fbfdfd; border-radius: 0 0 8px 8px; }
  .actionbar .sum { color: var(--ink-2); }
  .actionbar .sum b { color: var(--ink); }

  /* ── Modal ── */
  .scrim { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal { background: var(--surface); border-radius: 10px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; box-shadow: 0 20px 50px rgba(15,23,42,.25); }
  .modal.wide { width: min(640px, 100%); }
  .modal header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .modal header h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .modal .x { border: 0; background: none; cursor: pointer; color: var(--ink-3); font-size: 16px; }
  .modal .mb { padding: 14px 16px; display: grid; gap: 14px; }
  .modal footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .lst { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lst .it { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); align-items: center; }
  .lst .it:last-child { border-bottom: 0; }
  .lst .it .n { font-weight: 500; }
  .lst .it .d { grid-column: 1 / -1; font-size: 11px; color: var(--ink-2); }
  .callout { background: var(--primary-50); border: 1px solid var(--primary-100); color: #134e4a; border-radius: 8px; padding: 9px 12px; line-height: 1.55; }
  .ok { display: flex; gap: 12px; align-items: center; }
  .ok .ic { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-50); color: var(--primary); display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
  .ok .h { font-weight: 600; font-size: 13px; }
  .ok .s { color: var(--ink-2); margin-top: 2px; }
  .sec { display: grid; gap: 6px; }
  .sec .lab { font-size: 11px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; }
  .sec .lab button { border: 0; background: none; color: var(--ink-3); font-size: 11px; cursor: pointer; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .field { display: grid; gap: 4px; }
  .field label { font-size: 11px; color: #374151; font-weight: 500; }
  .field input, .field select { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 12px; width: 100%; }
  .hint { font-size: 11px; color: var(--ink-3); }

  @media (max-width: 720px) {
    .duestrip { grid-template-columns: 1fr; }
    .search input { width: 100%; }
    .search { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
  // ── Sample data (examples only; not real customers) ────────────────────────
  const TODAY = new Date(2026, 9, 1); // 1 ต.ค. 2569
  const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addYears = (d, n) => new Date(d.getFullYear() + n, d.getMonth(), d.getDate());
  const fmt = new Intl.DateTimeFormat('th-TH-u-ca-buddhist', { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtMonth = new Intl.DateTimeFormat('th-TH-u-ca-buddhist', { month: 'short', year: '2-digit' });
  const pad = n => String(n).padStart(2, '0');
  const fd = d => d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` : '—'; // dd/MM/yyyy like the app
  const money = n => n == null ? '—' : n.toLocaleString('th-TH');
  const days = (a, b) => Math.round((b - a) / 86400000);

  function ymd(from, to) {
    let y = to.getFullYear() - from.getFullYear(), m = to.getMonth() - from.getMonth(), d = to.getDate() - from.getDate();
    if (d < 0) { m--; d += new Date(to.getFullYear(), to.getMonth(), 0).getDate(); }
    if (m < 0) { y--; m += 12; }
    return { y, m, d };
  }
  function remainText(due) {
    const n = days(TODAY, due);
    if (n < 0) return `เกินกำหนด ${-n} วัน`;
    if (n <= 90) return `อีก ${n} วัน`;
    const { y, m } = ymd(TODAY, due);
    return 'อีก ' + [y ? `${y} ปี` : '', m ? `${m} เดือน` : ''].filter(Boolean).join(' ');
  }
  function urgency(due) {
    const n = days(TODAY, due);
    return n < 0 ? 'crit' : n <= 90 ? 'warn' : n <= 365 ? 'note' : 'ok';
  }
  const RT = { '1': ['ทบทวนปกติ', 's1'], '2': ['ก่อน Stage 3', 's2'], '3': ['Stage 3', 's3'] };

  const rows = [
    { id: 'c1', book: '64A01235', coll: 'ที่ดินพร้อมบ้านเดี่ยว 2 ชั้น · ต.บางพูด', cif: '69000021', cust: 'นางสาวพิมพ์ชนก ศรีวงศ์', rt: '2', appr: '2021-08-15', src: 'CAS', first: '2026-03-09' },

    return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ct"><header><h3 id="ct">เริ่มคำขอทบทวน ${1 + sel.length} เล่ม</h3><button class="x" data-close aria-label="ปิด">✕</button></header>
      <div class="mb"><div class="lst">${item('69000072', false)}${sel.map(n => item(n.book, n.legacy)).join('')}</div>
        <div class="callout">คำขอจะถูกสร้างเป็น<b>ฉบับร่าง</b> ยังไม่ส่งเข้าสายงาน — เจ้าหน้าที่ต้องเปิดตรวจ กรอกนัดหมาย แล้วกดส่งเองที่หน้ารายการคำขอ</div></div>
      <footer><button class="btn" data-close>ยกเลิก</button><button class="btn primary" data-go="result">สร้าง ${1 + sel.length} คำขอ</button></footer></div></div>`;
  }

  function skipModal() {
    return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="st"><header><h3 id="st">ไม่ทบทวนรอบนี้</h3><button class="x" data-close aria-label="ปิด">✕</button></header>
      <div class="mb"><p style="margin:0;line-height:1.6">ย้ายเล่มนี้ไปแท็บ "ไม่ทบทวนรอบนี้" ข้อมูลจาก AS400 ยังอัปเดตทุกเดือน และกดนำกลับได้ตลอด</p></div>
      <footer><button class="btn" data-close>ยกเลิก</button><button class="btn primary" data-close>ย้ายไปไม่ทบทวนรอบนี้</button></footer></div></div>`;
  }

  function filterModal() {
    const opt = (label, on) => `<button class="chip-btn" aria-pressed="${on}" data-toggle>${label}</button>`;
    return `<div class="scrim"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="ft"><header><h3 id="ft">ตัวกรอง</h3><button class="x" data-go="list" aria-label="ปิด">✕</button></header>
      <div class="mb">
        <div class="sec"><div class="lab">ประเภทการทบทวน</div><div class="opts">${opt('ทั้งหมด', false)}${opt('Stage 3', true)}${opt('ก่อน Stage 3', false)}${opt('ทบทวนปกติ', false)}</div></div>
        <div class="sec"><div class="lab">ครบกำหนดทบทวน <button>ล้าง</button></div>
          <div class="opts">${opt('เกินกำหนดแล้ว', false)}${opt('ภายใน 90 วัน', true)}${opt('ภายใน 6 เดือน', false)}${opt('ภายใน 1 ปี', false)}${opt('กำหนดเอง', false)}</div>
          <div class="hint">เลือกแบบสำเร็จรูป หรือ "กำหนดเอง" เพื่อใส่จำนวนวันเหลือ จาก–ถึง</div></div>
        <div class="sec"><div class="lab">วันที่ประเมินล่าสุด <button>ล้าง</button></div><div class="row2">
          <div class="field"><label for="f-from">ตั้งแต่</label><input id="f-from" placeholder="วว/ดด/ปปปป" /></div>
          <div class="field"><label for="f-to">ถึง</label><input id="f-to" placeholder="วว/ดด/ปปปป" /></div></div></div>
        <div class="sec"><div class="lab">ระบุเจาะจง</div><div class="row2">
          <div class="field"><label for="f-coll">รหัสหลักประกัน</label><input id="f-coll" placeholder="กรอกรหัสหลักประกัน" /></div>
          <div class="field"><label for="f-src">เล่มเดิม</label><select id="f-src"><option>ทั้งหมด</option><option>ใบในระบบ CAS</option><option>เล่ม AS400</option><option>ไม่พบเล่มเดิม</option></select></div></div></div>
      </div>
      <footer><button class="btn" style="margin-right:auto">ล้างทั้งหมด</button><button class="btn" data-go="list">ยกเลิก</button><button class="btn primary" data-go="list-f">แสดง 2 รายการ</button></footer></div></div>`
      + `<div class="shell" style="position:relative;z-index:60;padding-top:0">${notes('เปลี่ยนอะไรในตัวกรอง', [
        'ชื่อลูกค้า / เลขเล่ม / CIF ย้ายไปช่องค้นหาบนหัวหน้า — หน้าต่างนี้เหลือแต่ตัวกรองที่เป็นช่วงและตัวเลือก',
        'ประเภทการทบทวน: dropdown → ปุ่มเลือก เห็นตัวเลือกครบทันที',
        'วันที่เหลือ: กรอกตัวเลขจาก–ถึง → ปุ่มสำเร็จรูป (เกินกำหนด / 90 วัน / 6 เดือน / 1 ปี) + กำหนดเอง ใช้พารามิเตอร์ remainingDay เดิมได้ (เกินกำหนด = เหลือ &lt; 0' + Q + ')',
        'เพิ่มตัวกรอง "เล่มเดิม" (CAS / AS400 / ไม่พบ)' + BE,
        'ปุ่มยืนยันบอกจำนวนผลลัพธ์ก่อนกด ("แสดง 2 รายการ")' + BE + ' — ถ้าไม่ทำ ใช้คำว่า "ใช้ตัวกรอง" แบบเดิม',
        'ช่องกรอกยังเป็นกล่องขาวมีเส้นขอบตามแบบของแอป',
      ])}</div>`;
  }

  // ── Block-project unit (new) ──────────────────────────────────────────────
  function unitView(kind) {
    const ticket = kind === 'd-unit-ticket', miss = kind === 'd-unit-miss';
    const u = ticket
      ? { book: '69U00004', project: 'หมู่บ้านริเวียร่า บางนา', projNo: '69000076', type: 'LB', cust: 'นายกิตติ ศรีสุข', cif: '69000042',
          how: 'เลขตั๋ว 69U00004 (ตั๋วที่ CAS ออกให้)', fields: [['บ้านเลขที่', '102'], ['เลขแปลง', 'P-002'], ['เนื้อที่ดิน', '62 ตร.ว.'], ['พื้นที่ใช้สอย', '180 ตร.ม.'], ['แบบบ้าน', 'Riviera · 2 ชั้น']], price: 4850000, date: '2026-05-20' }
      : { book: miss ? '69105469' : 'B69105468', project: miss ? 'โครงการ ไลฟ์ อโศก' : 'โครงการ block 16/09/2026', projNo: miss ? '69105469' : '69105468', type: 'U', cust: miss ? 'นายภูมิ พงษ์ไทย' : 'นางสาวสุนิสา แก้วใส', cif: miss ? '69000043' : '69000041',
          how: miss ? null : 'เลขห้อง 129/318 ในชื่อหลักประกัน "CONDO.129/318 …"', fields: [['อาคาร', 'B'], ['ชั้น', '7'], ['เลขห้อง', '007B11'], ['ทะเบียนห้องชุด', '129/318'], ['พื้นที่ใช้สอย', '28.69 ตร.ม.'], ['แบบห้อง', '1 BEDROOM (2)']], price: 2697000, date: '2026-09-16' };
    const typeLabel = u.type === 'U' ? '08 ห้องชุด' : '02 ที่ดินพร้อมสิ่งปลูกสร้าง';
    const row = (label, value, src) => `<dt>${label}</dt><dd>${value}</dd><span class="src">${src}</span>`;
    const banner = miss
      ? `<div class="banner warn"><div class="body"><div class="t">หายูนิตในโครงการไม่เจอ</div>
          ไม่พบเลขห้อง/บ้านเลขที่ในชื่อหรือที่อยู่หลักประกันที่ตรงกับยูนิตเดียวในโครงการ ${u.projNo} — คำขอจะมีแค่ข้อมูลโครงการ เจ้าหน้าที่ต้องกรอกห้อง/แปลงเองก่อนกดส่ง</div></div>`
      : `<div class="banner" style="background:var(--primary-50);border-color:var(--primary-100);color:#134e4a"><div class="body"><div class="t">ทบทวนยูนิตในโครงการ ${u.projNo}</div>
          จับคู่ยูนิตได้จาก${u.how} · ทบทวนเฉพาะยูนิตนี้ ยูนิตอื่นในโครงการแยกกัน</div></div>`;
    return `<div class="phead">
        <div class="titlewrap"><button class="back" data-go="list" aria-label="กลับไปยังรายการ">‹</button>
          <div><div class="titleline"><h2 class="num book">${u.book}</h2><span class="tag main">รอดำเนินการ</span><span class="tag unit">ยูนิตโครงการ</span></div>
          <p>${u.cust} · CIF ${u.cif} · ${u.project}</p></div></div>
        <div class="ctrls"><button class="btn danger" data-modal="skip">ไม่ทบทวนรอบนี้</button></div>
      </div>
      ${banner}
      <div class="facts">
        <div class="card"><h3>ยูนิตในโครงการ <small>${miss ? 'ยังไม่รู้ว่ายูนิตไหน' : 'จาก CAS'}</small></h3>
          ${miss ? '<p class="muted" style="margin:0">—</p>' : `<dl class="kv">${u.fields.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}
          <dt>ราคาประเมินรายยูนิตเดิม</dt><dd class="num">${money(u.price)} บาท</dd></dl>`}</div>
        <div class="card"><h3>โครงการ <small class="num">ใบ ${u.projNo}</small></h3><dl class="kv">
          <dt>ชื่อโครงการ</dt><dd>${u.project}</dd><dt>ประเภท</dt><dd>${u.type === 'U' ? 'คอนโด' : 'ที่ดิน+อาคาร'}</dd>
          <dt>ที่อยู่</dt><dd class="long">ถ.สุขุมวิท แขวงพระโขนงเหนือ เขตวัฒนา กรุงเทพมหานคร 10110</dd>
          <dt>ประเมินโครงการเมื่อ</dt><dd class="num">${fd(D(u.date))}</dd></dl></div>
        <div class="card" style="grid-column: span 2"><h3>คำขอที่จะสร้าง <small>ช่องที่ระบบเติมให้ · ที่มา</small></h3>
          <dl class="fill">
            ${row('ประเภทหลักประกัน', typeLabel, 'โครงการ')}
            ${row('ชื่อโครงการ', u.project, 'โครงการ')}
            ${row('ที่อยู่', 'ตามที่อยู่โครงการ', 'โครงการ')}
            ${miss ? row('ห้อง / แปลง', '<span class="manual">กรอกเอง</span>', '—')
                   : u.fields.map(([k, v]) => row(k, v, 'ยูนิต')).join('')}
            ${row('ใบประเมินเดิม', `<span class="num">${u.projNo}</span> (ใบโครงการ)`, 'โครงการ')}
            ${row('ราคา / วันที่ประเมินเดิม', miss ? '<span class="manual">ไม่มี (ยังไม่รู้ยูนิต)</span>' : `<span class="num">${money(u.price)} บาท · ${fd(D(u.date))}</span><span class="q">รอตัดสิน</span>`, miss ? '—' : 'ยูนิต')}
            ${row('ลูกค้า', '<span class="manual">กรอกเอง</span><span class="q">รอตัดสิน</span>', '—')}
            ${row('เลขโฉนด / หนังสือกรรมสิทธิ์', '<span class="manual">กรอกเอง</span>', '—')}
            ${row('เอกสาร', '<span class="manual">แนบเอง (ไม่ copy เอกสารโครงการ)</span>', '—')}
          </dl></div>
      </div>
      <div class="card"><div class="actionbar" style="position:static">
        <span class="sum">จะสร้าง <b>1</b> คำขอ (ฉบับร่าง) สำหรับยูนิตนี้</span>
        <button class="btn primary">เริ่มคำขอทบทวน <span class="badge num">1</span></button></div></div>
    ` + notes('ยูนิตในโครงการจัดสรร — เลขที่ชี้ไปใบโครงการ (มี B / ไม่มี B / เลขตั๋ว)', [
        '<b>ทบทวนรายยูนิต</b>: หน่วย = หมายเลขประเมิน + รหัสหลักประกัน — ยูนิตอื่นในโครงการเดียวกันไม่ถูกบล็อก ไม่ถูกตั้ง "ดำเนินการแล้ว" ไปด้วย',
        '<b>หายูนิต</b>: เลขตั๋ว → ยูนิตที่ตั๋วครอบ (แน่นอน) · มี B / ไม่มี B → อ่านเลขห้องจาก "CONDO.xxx" ในชื่อหลักประกัน หรือคำแรกของที่อยู่ (บ้านเลขที่) แล้วเทียบเลขทะเบียน → เลขห้อง → บ้านเลขที่ — กติกาเดียวกับ regulatory',
        '<b>ข้อมูลในคำขอมาจาก CAS เท่านั้น</b> (ยูนิต + โครงการ) — ไม่ copy คำขอทั้งโครงการ (โฉนดทุกแปลง/เอกสารโครงการ) แบบที่ระบบทำอยู่ตอนนี้ และไม่เอาค่าจากไฟล์ AS400',
        '<b>หายูนิตไม่เจอ หรือเจอหลายยูนิต</b>: ยังกดเริ่มได้ คำขอมีแค่ข้อมูลโครงการ + แบนเนอร์เตือน' + Q,
        '<b>ราคา/วันที่ประเมินเดิมในคำขอ</b> = ราคาประเมินรายยูนิตจากใบโครงการ + วันประเมินโครงการ (ไม่ใช่ราคาทั้งโครงการ)' + Q,
        '<b>ลูกค้า</b>: เว้นให้กรอกเอง หรือใช้ชื่อผู้ซื้อของยูนิตใน CAS (ProjectUnits.PurchaseBy — ใน dev ว่างแทบทั้งหมด)' + Q,
        '<b>คำขอทบทวนยูนิตที่สร้างเองจากหน้าคำขอ</b> (อ้างใบโครงการ) บอกไม่ได้ว่ายูนิตไหน → ไม่ตั้งยูนิตใดเป็นดำเนินการแล้ว เจ้าหน้าที่จัดการในหน้านี้เอง' + Q,
        'เล่มใกล้เคียง: ยูนิตโครงการไม่แสดงตาราง "รวมเล่มใกล้เคียง" ในรอบแรก (กดเริ่มทีละยูนิต)' + Q,
      ]);
  }

  // ── Router ─────────────────────────────────────────────────────────────────
  const app = document.getElementById('app');
  const modalRoot = document.getElementById('modal-root');
  let view = 'list';
  let modal = null;
  function render() {
    document.querySelectorAll('.mockbar button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === view || (view === 'list-f' && b.dataset.view === 'list'))));
    app.innerHTML = view === 'skipped' ? skippedView()
      : view === 'reviewed' ? reviewedView()
      : view.startsWith('d-unit') ? unitView(view)
      : view.startsWith('d-') ? detailView(view)
      : listView({ filterCount: view === 'list-f' ? 2 : 0 });
    modalRoot.innerHTML = view === 'filter' ? filterModal() : view === 'result' ? resultModal()
      : modal === 'confirm' ? confirmModal() : modal === 'skip' ? skipModal() : '';
  }
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-view],[data-go],[data-quick],[data-rquick],[data-pick],[data-modal],[data-close],[data-toggle],[data-stop]');
    if (!t) return;
    if (t.dataset.stop !== undefined) { e.stopPropagation(); return; }
    if (t.dataset.toggle !== undefined) { const on = t.getAttribute('aria-pressed') === 'true'; t.parentElement.querySelectorAll('[data-toggle]').forEach(b => b.setAttribute('aria-pressed', 'false')); t.setAttribute('aria-pressed', String(!on)); return; }
    if (t.dataset.view) { view = t.dataset.view; modal = null; }
    else if (t.dataset.go) { view = t.dataset.go; modal = null; if (view === 'list') quick = quick; }
    else if (t.dataset.quick) { quick = t.dataset.quick; }
    else if (t.dataset.rquick) { rquick = t.dataset.rquick; }
    else if (t.dataset.pick) { picked.has(t.dataset.pick) ? picked.delete(t.dataset.pick) : picked.add(t.dataset.pick); }
    else if (t.dataset.modal) { modal = t.dataset.modal; }
    else if (t.dataset.close !== undefined) { modal = null; }
    render();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (modal || view === 'filter' || view === 'result')) { modal = null; if (view === 'filter' || view === 'result') view = 'list'; render(); } });
  render();
})();
</script>
