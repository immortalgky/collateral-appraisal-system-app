<!DOCTYPE html>
<html lang="en" data-theme="light" class="h-full bg-white">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Collateral Appraisal System</title>
    <script>
        // Applied before first paint. React only mounts after the auth check
        // resolves, so theme and UI density have to land here or the app would
        // paint light-and-unscaled first, then snap.
        // Density factors mirror DENSITY_SCALE in src/shared/components/densityConstants.ts.
        try {
            var raw = localStorage.getItem('cas-ui-store');
            if (raw) {
                var parsed = JSON.parse(raw);
                var state = (parsed && parsed.state) || {};
                var theme = state.theme;
                if (theme === 'dark' || theme === 'light') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
                var scale = { compact: 0.92, normal: 1, comfortable: 1.12 }[state.density];
                if (scale) {
                    document.documentElement.style.setProperty('--cas-density', String(scale));
                }
            }
        } catch (e) { /* fall back to default data-theme="light" and --cas-density: 1 */ }
    </script>
</head>
<body class="h-full">
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
